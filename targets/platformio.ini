; Target compile-smoke for Design Is Deploy product sketches.
; Requires PlatformIO Core: https://docs.platformio.org/en/latest/core/installation.html
;
;   cd targets && pio run                              # full green matrix + PID sketch
;   cd targets && pio run -e teensy41 -e nucleo_g474re  # primary pair only
;   make targets                                       # same as pio run (all default_envs)
;   make targets ENVS="teensy41 nucleo_g474re"         # primary pair from repo root
;
; Sources are the product folders under examples/ — not a parallel targets/sketches/
; tree. Default sketch: examples/control/pid/pid_sketch.cpp
; Cart-pole LQR: set src_dir = ../examples/control/cart_pole and
;   build_src_filter = +<cart_pole_sketch.cpp>
;
; Profile: targets/damp_profile.hpp → ETL containers + DAMP_MATH_BACKEND_DAMP
; (needs libs/etl submodule on the include path).
;
; C++20 is required (concepts, constinit). Do not lower the standard.
; Host-only gate (no board toolchain): make target-smoke from repo root.

[platformio]
; Full green matrix (see targets/README.md). First build downloads toolchains.
; Subset: pio run -e teensy41 -e nucleo_g474re   or   make targets ENVS="teensy41 nucleo_g474re"
default_envs =
    teensy41
    teensy40
    nucleo_g474re
    blackpill_f411ce
    pico
    esp32s3
; Product sketch directory (relative to this ini). Only the *_sketch.cpp is built.
src_dir = ../examples/control/pid
description = Damp Design Is Deploy — product sketch compile-smoke (ETL + Damp math)

; Shared flags — product-ish runtime defaults (not size-first Arduino -Os).
; - Optimization: frameworks often inject -Os/-O2; unflag those and force -O3.
;   -ffast-math matches host tests; Damp is hardened (bit-pattern isfinite, no
;   fragile algebraic cancellations). No -flto: Damp is header-only and the
;   product sketch is one TU, so LTO buys little vs. framework/toolchain pain
;   (Pico GCC without LTO, ESP ld plugin issues). Section GC still drops unused
;   framework objects (-ffunction-sections -fdata-sections -Wl,--gc-sections).
; - build_unflags: dialect pins (C++11/14/17) and competing -O* so our -O3 wins.
;   Never unflag -fno-rtti / -fno-exceptions / -fomit-frame-pointer (we want them).
; - Do not put -std=gnu++20 / -fno-rtti / -fno-exceptions / -Wno-volatile on
;   build_flags — they warn on every framework .c file. CXXFLAGS only via
;   pio_cxx_flags.py.
; - Do not apply Jason Turner / -Wpedantic to framework TUs: Teensy cores flood
;   stderr and PowerShell surfaces that as a failed `make targets`.
; - build_src_flags: warnings on product sketch only. Omit -Wpedantic /
;   -Wold-style-cast / -Wconversion / -Wshadow (Arduino.h is in the sketch
;   include graph).
; - -I. → targets/damp_profile.hpp (ETL + DAMP_MATH_BACKEND_DAMP)
; - -isystem for ETL so third-party headers do not inherit sketch warnings
; - -DNDEBUG: release-shaped smoke (no assert tax on target)
[env]
extra_scripts = pre:pio_cxx_flags.py
build_flags =
    -O3
    -ffast-math
    -fomit-frame-pointer
    -ffunction-sections
    -fdata-sections
    -DNDEBUG
    -I../inc
    -I.
    -isystem../libs/etl/include
    -Wl,--gc-sections
build_src_flags =
    -Wall
    -Wextra
    -Wcast-align
    -Wunused
    -Woverloaded-virtual
    -Wnull-dereference
    -Wdouble-promotion
    -Wfloat-conversion
    -Wformat=2
    -Wimplicit-fallthrough
    -Wmisleading-indentation
    -Wduplicated-cond
    -Wduplicated-branches
    -Wlogical-op
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
    -std=c++11
    -std=c++14
    -std=c++17
    -Os
    -O0
    -O1
    -O2
    -Og
    -O
; Sketch only — do not compile *_sil.cpp from the product folder.
build_src_filter = +<pid_sketch.cpp>

; =============================================================================
; Teensy 4.x — primary (GREEN)
; Cortex-M7, Teensy package GCC 15 arm-none-eabi
; =============================================================================
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino

; =============================================================================
; STM32 — GREEN (platform ststm32 ships GCC 12.3)
; Nucleo G474RE: Cortex-M4F, motor/PE-adjacent
; =============================================================================
[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = arduino

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino

; =============================================================================
; Raspberry Pi Pico (RP2040)
; Stock platform-raspberrypi pins GCC 9.2 (no -std=gnu++20). Use earlephilhower
; core via maxgerhardt platform fork — ships a modern enough arm GCC for C++20.
;
; Framework noise under -O3 (not Damp code):
; - pico-sdk headers pulled into the sketch (Arduino.h) trip -Wunused-parameter
; - lwIP dhcp.c hits -Wstringop-overflow when inlined
; Demote those here only; keep shared sketch warnings on other envs.
; =============================================================================
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
; First clone is slow; subsequent builds reuse the package cache.
build_flags =
    ${env.build_flags}
    -Wno-stringop-overflow
build_src_flags =
    ${env.build_src_flags}
    -Wno-unused-parameter

; =============================================================================
; ESP32-S3
; Stock espressif32@7 Arduino package pins Xtensa GCC 8.4 (no gnu++20).
; pioarduino platform ships IDF/Arduino with a modern toolchain (C++20).
; Pin a release zip so the recipe is reproducible.
; =============================================================================
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; =============================================================================
; BLOCKED — toolchain too old for C++20
; =============================================================================
; Uno R4 Minima: renesas-ra → GCC 7.2 (rejects gnu++20). Revisit when ≥ GCC 10.
; [env:uno_r4_minima]
; platform = renesas-ra
; board = uno_r4_minima
; framework = arduino
